services:
  - type: web
    name: ai-loan-model-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: 7
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ACCESS_COOKIE_NAME
        value: lm_access
      - key: REFRESH_COOKIE_NAME
        value: lm_refresh
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: true
